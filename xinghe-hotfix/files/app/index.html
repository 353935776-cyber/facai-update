  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星核AIGC</title>
    <script>
      // 早期诊断：在主入口之前埋点，确认 renderer 进程是否真的被加载
      (function () {
        try {
          const tag = '[index.html][inline-boot]';
          // 写到 localStorage，等主进程通过 IPC 取出
          const payload = {
            ts: new Date().toISOString(),
            url: location.href,
            userAgent: navigator.userAgent,
            docState: document.readyState,
          };
          localStorage.setItem('__dreamyuan_boot_diag', JSON.stringify(payload));
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <script src="./localproxy-hook.js"></script>

    <link rel="stylesheet" crossorigin href="./assets/index-BkTd7tXu.css">
    <style id="xinghe-chrome-cleanup">
      /* 界面清理：这两处是原版遗留的内部标识，对用户没有意义
         - .app-version：头部「星核AIGC」后面的 V4 版本徽标
         - .username / .expire-text：右上角「用户: local」「到期时间: --」占位信息 */
      .app-version,
      .top-header .username,
      .top-header .expire-text {
        display: none !important;
      }

      /* 激活页的「本机机器码」一行：发给作者换激活码用。刻意做小，不抢激活框的视线。
         激活页是深色底，所以用浅灰/白，别用主界面那套深灰（那会糊在背景里看不见） */
      .xh-machine-tip {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 12px;
        line-height: 18px;
        color: #8b95a8;
        user-select: text;
      }
      .xh-machine-tip b {
        font-family: ui-monospace, Consolas, 'Courier New', monospace;
        font-weight: 600;
        letter-spacing: 0.6px;
        color: #e8edf6;
      }
      .xh-machine-tip i {
        font-style: normal;
        cursor: pointer;
        padding: 1px 7px;
        border: 1px solid rgba(150, 165, 200, 0.42);
        border-radius: 6px;
        color: #c3ccff;
        background: rgba(255, 255, 255, 0.06);
      }
      .xh-machine-tip i:hover { border-color: rgba(160, 175, 255, 0.8); background: rgba(120, 130, 255, 0.2); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 风格选择面板 V2：全局加载。原来这段注入挂在「漫剧工作台」懒加载 chunk 末尾，
         客户冷启动直接进作品列表页时不会执行，「新增作品」弹窗就还是旧的 4 列圆形图标。 -->
    <script src="./assets/style-panel-v2.js"></script>
    <script>
      /* 一机一码：在激活页显示本机机器码（前 12 位，跟发码用的完全一致）。
       * 只在「激活码」输入框存在时出现，进了主界面自动消失。
       * 这段不依赖打包，删掉这个 script 就回到原版外观。 */
      (function () {
        var BOX_ID = 'xh-machine-tip';
        var code = '';
        var timer = null;

        function copyText(text) {
          try { navigator.clipboard.writeText(text); return true; } catch (e) { /* 走兜底 */ }
          try {
            var t = document.createElement('textarea');
            t.value = text;
            t.style.position = 'fixed';
            t.style.opacity = '0';
            document.body.appendChild(t);
            t.select();
            document.execCommand('copy');
            t.remove();
            return true;
          } catch (e) { return false; }
        }

        function findInput() {
          var list = Array.prototype.slice.call(document.querySelectorAll('input'));
          for (var i = 0; i < list.length; i += 1) {
            if (/激活码/.test(list[i].getAttribute('placeholder') || '')) return list[i];
          }
          return null;
        }

        // 客户端没有「账号」这个概念，激活页这个输入框只会让人卡住：进页面就替他们填好，
        // 真正要他们动手的只剩「粘贴激活码」。清空了会自动补回。
        // 注意：只认激活页的「账号」输入框。主界面里也有 placeholder 含「账号」的框，
        // 例如豆包工作台的「搜索账号名称 / Profile / ID」；曾被每 700ms 的轮询误填成
        // 「星核用户」，导致 7 个账号全被过滤、页面显示「没有匹配的账号」。
        function prefillAccount() {
          if (!findInput()) return;
          var list = Array.prototype.slice.call(document.querySelectorAll('input'));
          for (var i = 0; i < list.length; i += 1) {
            var el = list[i];
            var ph = el.getAttribute('placeholder') || '';
            if (!/账号|帐号/.test(ph)) continue;
            if (/搜索|查找|筛选/.test(ph) || String(el.getAttribute('type') || '').toLowerCase() === 'search') continue;
            if (el.value) return;
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
            setter.call(el, '星核用户');
            el.dispatchEvent(new Event('input', { bubbles: true }));
            return;
          }
        }

        // 兼容旧版误填：把搜索类输入框里残留的「星核用户」清掉
        function clearWrongSearch() {
          var list = Array.prototype.slice.call(document.querySelectorAll('input'));
          for (var i = 0; i < list.length; i += 1) {
            var el = list[i];
            var ph = el.getAttribute('placeholder') || '';
            var isSearch = /搜索|查找|筛选/.test(ph) || String(el.getAttribute('type') || '').toLowerCase() === 'search';
            if (!isSearch || el.value !== '星核用户') continue;
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
            setter.call(el, '');
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }

        function ensure() {
          clearWrongSearch();
          prefillAccount();
          var old = document.getElementById(BOX_ID);
          var input = findInput();
          if (!input) { if (old) old.remove(); return; }
          if (old || !code) return;

          var box = document.createElement('div');
          box.id = BOX_ID;
          box.className = 'xh-machine-tip';
          var label = document.createElement('span');
          label.textContent = '本机机器码';
          var val = document.createElement('b');
          val.textContent = code;
          var btn = document.createElement('i');
          btn.textContent = '复制';
          btn.addEventListener('click', function () {
            copyText(code);
            btn.textContent = '已复制';
            setTimeout(function () { btn.textContent = '复制'; }, 1600);
          });
          box.appendChild(label);
          box.appendChild(val);
          box.appendChild(btn);

          // 挂在激活码输入框所在字段的后面；拿不到就退回它的父容器
          var field = input.parentElement;
          var host = field && field.parentElement;
          if (host && field.nextSibling) host.insertBefore(box, field.nextSibling);
          else if (host) host.appendChild(box);
          else if (field) field.appendChild(box);
        }

        function watch() {
          if (timer) return;
          timer = setInterval(ensure, 700);
        }

        function boot() {
          try {
            var sys = window.electronAPI && window.electronAPI.system;
            if (!sys || !sys.getMachineId) { setTimeout(boot, 500); return; }
            sys.getMachineId().then(function (r) {
              if (r && r.success && r.data) code = String(r.data);
              watch();
              ensure();
            }).catch(watch);
          } catch (e) { setTimeout(boot, 800); }
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
      })();
    </script>
  </body>
</html>
